<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Credit Card Fraud Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .card { box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: none; }
        .header-banner { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 20px; border-radius: 8px 8px 0 0; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card">
                <div class="header-banner text-center">
                    <h3>🛡️ Fraud Detection System</h3>
                    <p class="mb-0">Real-Time Transaction Risk Evaluation Engine</p>
                </div>
                <div class="card-body p-4">
                    
                    {% if prediction %}
                    <div class="alert alert-{{ alert_class }} text-center" role="alert">
                        <h5 class="alert-heading fw-bold">{{ prediction }}</h5>
                        {% if probability %}<p class="mb-0 small">{{ probability }}</p>{% endif %}
                    </div>
                    {% endif %}

                    <form action="/" method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Amount ($)</label>
                                <input type="number" step="0.01" class="form-control" name="amount" placeholder="e.g. 150.50" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Transaction Hour (0-23)</label>
                                <input type="number" min="0" max="23" class="form-control" name="transaction_hour" placeholder="e.g. 14" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Merchant Category</label>
                            <select class="form-select" name="merchant_category" required>
                                <option value="Food">Food</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Grocery">Grocery</option>
                                <option value="Travel">Travel</option>
                                <option value="Clothing">Clothing</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Foreign Transaction?</label>
                                <select class="form-select" name="foreign_transaction" required>
                                    <option value="0">No (Domestic)</option>
                                    <option value="1">Yes (International)</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Location Mismatch?</label>
                                <select class="form-select" name="location_mismatch" required>
                                    <option value="0">No</option>
                                    <option value="1">Yes (IP vs GPS error)</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Device Trust Score (0-100)</label>
                                <input type="number" min="0" max="100" class="form-control" name="device_trust_score" placeholder="e.g. 85" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Velocity (Last 24 Hours)</label>
                                <input type="number" min="0" class="form-control" name="velocity_last_24h" placeholder="e.g. 2" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Cardholder Age</label>
                            <input type="number" min="18" class="form-control" name="cardholder_age" placeholder="e.g. 35" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Analyze Transaction Risk</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
